# Laptop Lid Switch Configuration
# Disables the internal screen if the laptop lid is closed, and enables it when open.

# 1. Initialize screen state on startup/reload based on lid file
exec_always "grep -q closed /proc/acpi/button/lid/*/state && swaymsg output eDP-1 disable || swaymsg output eDP-1 enable"

# 2. Dynamic event handling
bindswitch lid:on output eDP-1 disable
bindswitch lid:off output eDP-1 enable
