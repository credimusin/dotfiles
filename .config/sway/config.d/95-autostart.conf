# VPN Autostart
exec /var/home/bmo/.local/bin/vpn-control.sh up

# Battery Notifier Autostart
exec /var/home/bmo/.local/bin/battery-notifier.sh

# Clipboard Watcher Daemon (Disabled, using CopyQ instead)
# exec /var/home/bmo/.local/bin/clip-watch.sh

# CopyQ Clipboard Manager
exec flatpak run com.github.hluk.copyq --start-server

# Workspace 1: Terminal Autostart
assign [app_id="Alacritty-Autostart"] workspace number 1
assign [class="Alacritty-Autostart"] workspace number 1
exec alacritty --class Alacritty-Autostart

# Workspace 2: Browser Autostart (Zen Browser)
assign [app_id="(?i)zen"] workspace number 2
assign [class="(?i)zen"] workspace number 2
assign [app_id="app.zen_browser.zen"] workspace number 2
exec flatpak run app.zen_browser.zen

# Waybar Autostart
# exec waybar
