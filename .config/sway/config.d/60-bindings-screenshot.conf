# Key bindings for taking screenshots overriding system defaults
# Uses grimshot on host and swappy inside the Fedora toolbox

# Capture a custom rectangular area and edit with swappy
bindsym Print exec grimshot save area - | toolbox run swappy -f -

# Capture all visible outputs (screen) and edit with swappy
bindsym Shift+Print exec grimshot save screen - | toolbox run swappy -f -

# Capture active window and edit with swappy
bindsym Alt+Print exec grimshot save active - | toolbox run swappy -f -

# Additional shortcut for laptop/60% keyboards
bindsym --to-code $mod+Shift+s exec grimshot save area - | toolbox run swappy -f -
