# ==============================================================================
# Настройки плавающих окон и автоматической группировки
# ==============================================================================

# 1. Глобальные правила для стандартных диалоговых окон
# ------------------------------------------------------------------------------
# Включаем плавающий режим для стандартных типов и ролей окон диалогов (GTK/Qt/X11)
for_window [window_role="dialog"] floating enable
for_window [window_role="popup"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="Preferences"] floating enable
for_window [window_role="GtkFileChooserDialog"] floating enable
for_window [window_role="file_chooser"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="menu"] floating enable
for_window [window_type="utility"] floating enable
for_window [window_type="toolbar"] floating enable
for_window [window_type="splash"] floating enable

# 2. Правила для системных диалогов выбора файлов (XDG Desktop Portal)
# ------------------------------------------------------------------------------
# Flatpak-приложения (Chromium, qBittorrent и др.) используют порталы для выбора файлов.
# Эти окна должны всегда открываться в плавающем режиме по центру экрана.
for_window [app_id="(?i)xdg-desktop-portal-gtk"] floating enable, resize set 900 600, move position center
for_window [class="(?i)xdg-desktop-portal-gtk"] floating enable, resize set 900 600, move position center
for_window [app_id="(?i)xdg-desktop-portal-kde"] floating enable, resize set 900 600, move position center
for_window [class="(?i)xdg-desktop-portal-kde"] floating enable, resize set 900 600, move position center

# Общие правила для заголовков диалогов выбора файлов (на случай, если тип окна не определился)
for_window [title="(?i)open file"] floating enable, move position center
for_window [title="(?i)save file"] floating enable, move position center
for_window [title="(?i)select a folder"] floating enable, move position center
for_window [title="(?i)choose directory"] floating enable, move position center
for_window [title="(?i)file properties"] floating enable, move position center
for_window [title="(?i)выберите файл"] floating enable, move position center
for_window [title="(?i)сохранить файл"] floating enable, move position center
for_window [title="(?i)выбор папки"] floating enable, move position center
for_window [title="(?i)свойства файла"] floating enable, move position center

# 3. Правила для Thunar (файловый менеджер)
# ------------------------------------------------------------------------------
# Главное окно Thunar заканчивается на " - Thunar" (например, "bmo - Thunar").
# Все остальные вспомогательные окна (переименование, свойства, прогресс копирования,
# конфликты файлов) не содержат этой приставки и должны всплывать.
for_window [app_id="(?i)thunar" title="^(?!.* - Thunar).*$"] floating enable, move position center
for_window [class="(?i)thunar" title="^(?!.* - Thunar).*$"] floating enable, move position center

# Автоматически группировать главное окно Thunar в режиме вкладок (tabbed)
# с активным в данный момент окном (например, браузером)
for_window [app_id="(?i)thunar" title=" - Thunar$"] layout tabbed
for_window [class="(?i)thunar" title=" - Thunar$"] layout tabbed

# 4. Правила для qBittorrent
# ------------------------------------------------------------------------------
# Главное окно qBittorrent содержит "qBittorrent" (например, "[D: 0 B/s, U: 0 B/s] qBittorrent v5.2.1").
# Все диалоги (добавление торрента, настройки, статистика и т.д.) должны всплывать.
for_window [app_id="(?i)qbittorrent" title="^(?!.*qBittorrent).*$"] floating enable, resize set 850 650, move position center
for_window [class="(?i)qbittorrent" title="^(?!.*qBittorrent).*$"] floating enable, resize set 850 650, move position center

# Автоматически группировать главное окно qBittorrent во вкладки (tabbed)
# с текущим активным окном (например, браузером), исключая разделение на узкие колонки
for_window [app_id="(?i)qbittorrent" title="^qBittorrent.*$"] layout tabbed
for_window [class="(?i)qbittorrent" title="^qBittorrent.*$"] layout tabbed

# 5. Правила для CopyQ (буфер обмена)
# ------------------------------------------------------------------------------
# Делаем окно CopyQ плавающим, центрированным и прямоугольного размера (800x650)
for_window [app_id="(?i)com.github.hluk.copyq"] floating enable, resize set 800 560, move position center

# 6. Музыкальный плеер (cmus) и аудио-нарезчик (flacon)
# ------------------------------------------------------------------------------
# Запуск cmus в специальном классе alacritty открывает его в плавающем окне.
for_window [app_id="cmus"] floating enable, border normal, resize set 1000 600
# Flacon открывается в плавающем окне среднего размера.
for_window [app_id="(?i)flacon"] floating enable, resize set 1050 750
for_window [class="(?i)flacon"] floating enable, resize set 1050 750

# 7. Менеджер Bluetooth (bluetuith / blueman)
# ------------------------------------------------------------------------------
for_window [app_id="(?i)bluetuith"] floating enable, border pixel 1, resize set 1000 600, move position center
for_window [class="(?i)bluetuith"] floating enable, border pixel 1, resize set 1000 600, move position center
for_window [app_id="(?i)blueman-manager"] floating enable, border pixel 1, resize set 1000 600, move position center
for_window [class="(?i)blueman-manager"] floating enable, border pixel 1, resize set 1000 600, move position center
