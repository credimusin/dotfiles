# ==============================================================================
# ask AI Assistant — Floating Autonomous TUI
# ==============================================================================

# Floating window rules: ~50% adaptive width and height, centered, crisp terminal border
for_window [app_id="(?i)ask-tui"] floating enable, border pixel 2, resize set width 52 ppt height 58 ppt, move position center
for_window [class="(?i)ask-tui"] floating enable, border pixel 2, resize set width 52 ppt height 58 ppt, move position center

# Keybinding: Super+Alt+i (Mod4 + Mod1 + i)
bindsym --to-code $mod+Mod1+i exec /var/home/bmo/.local/bin/ask-popup.sh
