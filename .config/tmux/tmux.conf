# Default shell and command
set -g default-shell /usr/bin/fish
set -g default-command "exec /usr/bin/fish -l"

# Mouse support
set -g mouse on

# Set Ctrl+q as prefix instead of Ctrl+b
# unbind C-b
# set -g prefix C-q
# bind C-q send-prefix

# List of plugins managed by TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Status line configuration
set -g status 3
set -ug status-format
set -g status-format[0] ""
set -g status-format[2] ""
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-bg default
set -g status-style bg=default,fg=default
set -g status-left-length 100
set -g status-right-length 100

# Left side: Terminal icon
set -g status-left "#[fg=blue,bold]   #[default]"

# Window format
set -g window-status-format "#[fg=color245] #{b:pane_current_path} #[fg=color240](#W) "
set -g window-status-current-format "#[fg=green,bold] #{b:pane_current_path} #[fg=green,nobold](#W) "


# Right side: CPU, Battery, Time
set -g status-right "#[fg=yellow]CPU: #{cpu_percentage} #[fg=color245]| #[fg=green]#(/var/home/bmo/.config/tmux/battery.sh) #[fg=color245]| #[fg=cyan]%H:%M #[default]"

# Pane border styling
set -g pane-border-indicators both
set -g pane-border-lines single
set -g pane-active-border-style "fg=green"
set -g pane-border-style "fg=color238"


# Enable automatic environment restore
set -g @continuum-restore 'on'

# Open new panes in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
