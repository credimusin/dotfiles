# Default shell and command
set -g default-shell /usr/bin/fish
set -g default-command "exec /usr/bin/fish -l"

# Mouse support
set -g mouse on

# Default terminal & colors (256 colors, truecolor RGB, italics, undercurl)
set -g default-terminal "tmux-256color"
set -as terminal-features ',rxvt-unicode-256color:clipboard,foot:clipboard:RGB:usstyle,xterm*:clipboard:RGB:usstyle'
set -as terminal-overrides ',*:Tc,*:Ms=\E]52;c;%p2%s\007'

# Clipboard integration (Wayland / wl-clipboard & OSC 52)
set -s set-clipboard on
set -s copy-command 'wl-copy'

# Copy mode settings & keybindings
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-C send-keys -X copy-pipe-and-cancel

# Fallback bindings for emacs copy mode
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode M-w send-keys -X copy-pipe-and-cancel
bind -T copy-mode C-w send-keys -X copy-pipe-and-cancel
bind -T copy-mode C-c send-keys -X copy-pipe-and-cancel
bind -T copy-mode C-C send-keys -X copy-pipe-and-cancel

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g pane-base-index 1

# Set Ctrl+q as prefix instead of Ctrl+b
# unbind C-b
# set -g prefix C-q
# bind C-q send-prefix

# List of plugins managed by TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Status line configuration
set -g status 3
set -ug status-format
set -g status-format[0] ""
set -g status-format[2] ""
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-bg default
set -g status-style bg=default,fg=default
set -g status-left-length 100
set -g status-right-length 100

# Update interval for status bar (in seconds)
set -g status-interval 1

# Left side: Animated terminal icon
set -g status-left "#(/var/home/bmo/.config/tmux/animate_icon.sh)"

# Window format
set -g window-status-format '#(/var/home/bmo/.config/tmux/format_window.sh "#{pane_current_path}" "#{window_name}" "0" "#{window_index}")'
set -g window-status-current-format '#(/var/home/bmo/.config/tmux/format_window.sh "#{pane_current_path}" "#{window_name}" "1" "#{window_index}")'
set -g window-status-current-style default


# Right side: CPU, Battery, Layout, Time (unified fast script)
set -g status-right "#(/var/home/bmo/.config/tmux/status_right.sh)"

# Pane border styling
set -g pane-border-indicators both
set -g pane-border-lines single
set -g pane-active-border-style "fg=green"
set -g pane-border-style "fg=color238"


# Enable automatic environment restore
set -g @continuum-restore 'on'

# Open new panes in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
